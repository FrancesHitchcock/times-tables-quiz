<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Times Tables Game</title>
</head>
<body>
    <div id="wrapper">
      <header>
         <div class="ctrl-button-container">
            <label class="toggle">
               <p>Theme</p>
               <input id="mode-btn" type="checkbox">
               <!-- google font icons dark mode and light mode svgs -->
               <div class="mode-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/></svg>
                  
                  <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M338.5-338.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/></svg>
               </div>
            </label>
         </div>
      </header>
      <main>
         <section class="section" id="title-container">
            <h1 id="primary-heading">Times Tables</h1>
            <h2 id="secondary-heading">Quiz</h2>
            <p id="instructions">Generate a multiplication fact and click on the right answer for a colourful surprise!</p>
         </section>
         <section class="section" id="fact-container">
            <div id="fact">
                <p id="fact-text-elem">?</p>
            </div>
         </section>
         <section class="section" id="response-container">
            <button class="response-btn">?</button>
            <button class="response-btn">?</button>
            <button class="response-btn">?</button>
         </section>
         <section class="section" id="new-fact-btn-container">
            <button id="next-question-btn">New fact</button>                    
         </section>
      </main>

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="main.js"></script>   
</body>
</html>
